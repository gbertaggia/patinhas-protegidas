<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Cadastro Histórico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        @media (max-width: 450px) {
            .card { border: none; box-shadow: none !important; background-color: transparent !important; }
            body { background-color: #fff !important; }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center">
       <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
        <h3 class="text-center text-danger mb-4">🏥 Histórico Médico</h3>

        <form method="POST" action="{{ url_for('cadastrar_historico', id_animal=animal.id) }}">
            
            <input type="hidden" name="animal_id" value="{{ animal.id }}">
            
            <div class="mb-3">
                <label class="form-label">Nome do Pet:</label>
                <input type="text" class="form-control" value="{{ animal.nome }}" readonly>
            </div>

            <div class="mb-3">
                <label for="data_consulta" class="form-label">Data do Atendimento:</label>
                <input type="date" id="data_consulta" name="data_consulta" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="local" class="form-label">Local:</label>
                <input type="text" id="local" name="local" class="form-control" placeholder="Nome da clínica">
            </div>

            <div class="row">
                <div class="col-6 mb-3">
                    <label for="peso" class="form-label">Peso (kg):</label>
                    <input type="text" id="peso" name="peso" class="form-control" placeholder="Ex: 4 ou 4.5">
                </div>
                <div class="col-6 mb-3">
                    <label for="temp" class="form-label">Temp. (°C):</label>
                    <input type="text" id="temp" name="temp" class="form-control" placeholder="Ex: 38.5">
                </div>
            </div>

            <div class="mb-3">
                <label for="motivo" class="form-label">Motivo do Atendimento:</label>
                <select name="motivo" id="motivo" class="form-select">
                    <option value="rotina">Consulta de Rotina</option>
                    <option value="urgência">Urgência/Emergência</option>
                    <option value="retorno">Retorno</option>
                    <option value="exame">Realização de Exames</option>
                    <option value="castração">Castração</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="sintomas" class="form-label">Sintomas:</label>
                <textarea class="form-control" id="sintomas" name="sintomas" rows="2" placeholder="Descreva os sintomas do pet"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="diagnostico" class="form-label">Diagnóstico:</label>
                <textarea class="form-control" id="diagnostico" name="diagnostico" rows="2" placeholder="Descreva o diagnóstico do veterinário..."></textarea>
            </div>

            <div class="mb-3">
                <label for="prescricao" class="form-label">Prescrição / Tratamento:</label>
                <textarea class="form-control" id="prescricao" name="prescricao" rows="2" placeholder="Remédios, dosagens e recomendações..."></textarea>
            </div>

            <div class="mb-4">
                <label for="arquivo" class="form-label">Anexar Exame/Receita (URL):</label>
                <input type="text" class="form-control" id="arquivo" name="arquivo" placeholder="Link do arquivo ou foto">
            </div>

            <button type="submit" class="btn btn-danger w-100 btn-lg shadow-sm">Salvar Registro</button>
            <a href="{{ url_for('animais.pagina_animal', id_animal=animal.id) }}" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
