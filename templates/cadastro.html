<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<script src="{{ url_for('static', filename='js/cadastro.js') }}" defer></script>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow p-4 m-3" style="width: 100%; max-width: 400px;">
        <h3 class="text-center text-success mb-4">🐾 Criar conta</h3>

        <form method="POST" action="/cadastrar">

            <fieldset class="mb-3">
                <legend class="form-label fs-6">Você é</legend>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipo-protetor" value="PROTETOR" required>
                    <label class="form-check-label" for="tipo-protetor">Protetor(a) independente</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo" id="tipo-ong" value="ONG" required>
                    <label class="form-check-label" for="tipo-ong">ONG</label>
                </div>
            </fieldset>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">WhatsApp / Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-8">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" name="cidade" maxlength="100" required>
                </div>
                <div class="col-4">
                    <label for="uf" class="form-label">Estado</label>
                    <select class="form-select" id="uf" name="uf" required>
                        <option value="">UF</option>
                        {% for sigla in ufs %}
                        <option value="{{ sigla }}">{{ sigla }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="missao" class="form-label">Missão da ONG</label>
                    <textarea class="form-control" id="missao" name="missao" rows="3" placeholder="Conte brevemente o propósito e missão da ONG..."></textarea>
                  </div>
                  
                  <div class="mb-3">
                    <label for="logo_url" class="form-label">URL do Logo</label>
                    <input type="url" class="form-control" id="logo_url" name="logo_url" placeholder="https://exemplo.com/logo.png">
                  </div>
                  
                  <div class="mb-3">
                    <label for="link_formulario_adocao" class="form-label">Link do Formulário de Adoção (Google Forms, Typeform, etc.)</label>
                    <input type="url" class="form-control" id="link_formulario_adocao" name="link_formulario_adocao" placeholder="https://forms.gle/exemplo">
                  </div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn btn-success w-100 mb-2">Criar Conta</button>
            <a href="/login" class="btn btn-outline-secondary w-100">Já tenho conta (Voltar)</a>
        </form>
    </div>

</body>
</html>
