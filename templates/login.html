<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Patinhas Protegidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tema.css') }}">
</head>
<body class="bg-light">
    {% set pagina_ativa = 'login' %}
    {% set navbar_publica = true %}
    {% include '_navbar.html' %}

    <main class="container py-4 py-md-5">
        <div class="pp-cartao">
            <a class="pp-voltar" href="/">← Voltar para campanhas e adoção</a>

            <div class="card shadow-sm p-4">
                <h1 class="text-center mb-1">Entrar</h1>
                <p class="text-center text-muted mb-4">Acesse sua conta para cuidar dos seus animais, campanhas e finanças.</p>

                {% if erro %}
                <div class="alert alert-danger" role="alert">{{ erro }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="protetora@email.com" value="{{ email or '' }}" autocomplete="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" required{% if erro %} autofocus{% endif %}>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar</button>
                </form>
            </div>

            <p class="text-center mt-3 mb-0">Ainda não tem conta? <a href="/cadastro" class="fw-bold">Criar conta</a></p>
        </div>
    </main>
</body>
</html>
