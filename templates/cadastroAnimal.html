<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Cadastro Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajuste para permitir rolagem em telas pequenas */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0; /* Espaço para não encostar no topo/rodapé do celular */
        }

        #container-data {
            display: none;
            margin-top: 10px;
        }

        #sim:checked~#container-data {
            display: block;
        }

        /* Ajuste fino para o card em telas muito pequenas */
        @media (max-width: 450px) {
            .card {
                border: none;
                box-shadow: none !important;
                background-color: transparent !important;
            }
            body {
                background-color: #fff !important; /* Fundo branco no mobile para parecer app */
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center text-success mb-4">🐾 Novo Animal</h3>

            <form method="POST" action="/cadastrar_animal">
                
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>

                <div class="mb-3">
                    <label for="especie" class="form-label">Espécie do Animal:</label>
                    <input type="text" class="form-control" id="especie" name="especie" list="lista-especies" placeholder="Selecione ou digite a espécie..." required>
                    <datalist id="lista-especies">
                        <option value="Cachorro">
                        <option value="Gato">
                        <option value="Coelho">
                        <option value="Ave">
                        <option value="Tartaruga">
                        <option value="Porquinho-da-índia">
                        <option value="Equino">
                    </datalist>
                </div>

                <div class="mb-3">
                    <label for="idade" class="form-label">Idade</label>
                    <input type="text" class="form-control" id="idade" name="idade" placeholder="Ex: 2 meses, 3 anos..." required>
                </div>

                <div class="mb-3">
                    <label for="raca" class="form-label">Raça do Animal:</label>
                    <input type="text" class="form-control" id="raca" name="raca" list="lista-racas" placeholder="Selecione ou digite a raça...">
                    <datalist id="lista-racas">
                        <option value="Sem Raça Definida (Vira-lata)">
                        <option value="Shih Tzu">
                        <option value="Poodle">
                        <option value="Siamês">
                    </datalist>
                </div>

                <div class="mb-3">
                    <fieldset>
                    <label class="form-label d-block">Animal já castrado?</label>
                    <!-- <div class="form-check form-check-inline"> -->
                        <input class="form-check-input" type="radio" id="sim" name="castrado" value="1">
                        <label class="form-check-label" for="sim">Sim</label>
                    <!-- </div> -->
                    <!-- <div class="form-check form-check-inline"> -->
                        <input class="form-check-input" type="radio" id="nao" name="castrado" value="0">
                        <label class="form-check-label" for="nao">Não</label>
                    <!-- </div> -->

                    <div id="container-data" class="mt-3">
                        <label for="data" class="form-label">Data da Castração:</label>
                        <input type="date" id="data" name="data" class="form-control">
                    </div>
                    </fieldset>
                </div>

                <div class="mb-4">
                    <label for="chip" class="form-label">Chip de identificação</label>
                    <input type="text" class="form-control" id="chip" name="chip">
                </div>

            <div class="mb-3">
                <label for="foto-pet" class="form-label">Foto do pet:</label>
                <input type="text" class="form-control" id="foto-pet" name="foto-pet" placeholder="URL da foto">
            </div>

            <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm fw-bold">Cadastrar Animal</button>

            <a href="{{ url_for('animais.painel') }}" class="btn btn-outline-secondary w-100 mt-2">
                Cancelar
            </a>
        </form>
        </div>
    </div>

</body>
</html>
