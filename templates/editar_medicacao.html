<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Editar Prescrição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        #container-horarios { display: block; }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center">
        <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center text-primary mb-4">✏️ Editar Prescrição</h3>

            <form method="POST" action="/salvar_edicao_medicacao/{{ remedio.id }}/{{ remedio.animal_id }}">
                
                <div class="mb-3">
                    <label for="medicacao" class="form-label fw-bold">Medicação:</label>
                    <input type="text" class="form-control" id="medicacao" name="medicacao" value="{{ remedio.nome_medicamento }}" required>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="data_inicio" class="form-label fw-bold">Data de Início:</label>
                        <input type="date" class="form-control" id="data_inicio" name="data_inicio" value="{{ remedio.data_inicio_medicamento or '' }}" required>
                    </div>

                    <div class="col-6 mb-3">
                        <label for="duracao" class="form-label fw-bold">Duração:</label>
                        <input type="text" class="form-control" id="duracao" name="duracao" value="{{ remedio.duracao_medicamento or '' }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="dose_med" class="form-label fw-bold">Dose:</label>
                        <input type="text" class="form-control" id="dose_med" name="dose_med" value="{{ remedio.dose_medicamento or '' }}">
                    </div>

                    <div class="col-6 mb-3">
                        <label for="frequencia" class="form-label fw-bold">Frequência:</label>
                        <select id="frequencia" name="frequencia" class="form-select" required>
                            <option value="" disabled {% if not remedio.frequencia %}selected{% endif %}>Selecione...</option>
                            <option value="24" {% if remedio.frequencia == '24' %}selected{% endif %}>Uma vez ao dia (24h)</option>
                            <option value="12" {% if remedio.frequencia == '12' %}selected{% endif %}>12h em 12h</option>
                            <option value="8" {% if remedio.frequencia == '8' %}selected{% endif %}>8h em 8h</option>
                            <option value="6" {% if remedio.frequencia == '6' %}selected{% endif %}>6h em 6h</option>
                            <option value="4" {% if remedio.frequencia == '4' %}selected{% endif %}>4h em 4h</option>
                        </select>
                    </div>
                </div>

                <div id="container-horarios" class="p-3 bg-light rounded border mb-3">
                    <label class="form-label fw-bold mb-2 text-primary">Horários atuais:</label>
                    <input type="text" class="form-control" name="horarios_texto" value="{{ remedio.horarios or '' }}" placeholder="Ex: 08:00,20:00">
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm fw-bold">Salvar Alterações</button>
                <a href="/pagina_animal/{{ remedio.animal_id }}" class="btn btn-outline-secondary w-100 mt-2 btn-sm fw-bold">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
