<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Cadastro Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajuste para permitir rolagem em telas pequenas */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0; /* Espaço para não encostar no topo/rodapé do celular */
        }

        #container-data {
            display: none;
            margin-top: 10px;
        }

        #sim:checked~#container-data {
            display: block;
        }

        /* Ajuste fino para o card em telas muito pequenas */
        @media (max-width: 450px) {
            .card {
                border: none;
                box-shadow: none !important;
                background-color: transparent !important;
            }
            body {
                background-color: #fff !important; /* Fundo branco no mobile para parecer app */
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center">
        <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center text-success mb-4">🏥 Nova Consulta</h3>

            <form method="POST" action="{{ url_for('cadastrar_consulta', id_animal=animal.id) }}">
                
                <input type="hidden" name="animal_id" value="{{ animal.id }}">
                
                <div class="mb-3">
                    <label for="nome_pet" class="form-label">Nome do Pet:</label>
                    <input type="text" id="nome_pet" class="form-control" value="{{ animal.nome }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="data_consulta" class="form-label">Data da Consulta:</label>
                    <input type="date" id="data_consulta" name="data_consulta" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="hora_consulta" class="form-label">Horário da Consulta:</label>
                    <input type="time" id="hora_consulta" name="hora_consulta" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="clinica" class="form-label">Clínica / Local:</label>
                    <input type="text" id="clinica" name="clinica" class="form-control" placeholder="Nome da clínica">
                </div>

                <div class="mb-3">
                    <label for="veterinario" class="form-label">Veterinário(a):</label>
                    <input type="text" id="veterinario" name="veterinario" class="form-control" placeholder="Nome do profissional">
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo da Consulta:</label>
                    <select name="motivo" id="motivo" class="form-select">
                        <option value="rotina">Consulta de Rotina</option>
                        <option value="urgência">Urgência/Emergência</option>
                        <option value="retorno">Retorno</option>
                        <option value="exame">Realização de Exames</option>
                        <option value="castração">Castração</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">Salvar Registro</button>
            </form>
        </div>
    </div>

</body>
</html>
