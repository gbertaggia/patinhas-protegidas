<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Cadastro Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajuste para permitir rolagem em telas pequenas */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0; /* Espaço para não encostar no topo/rodapé do celular */
        }

        #container-data {
            display: none;
            margin-top: 10px;
        }

        #sim:checked~#container-data {
            display: block;
        }

        /* Ajuste fino para o card em telas muito pequenas */
        @media (max-width: 450px) {
            .card {
                border: none;
                box-shadow: none !important;
                background-color: transparent !important;
            }
            body {
                background-color: #fff !important; /* Fundo branco no mobile para parecer app */
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center">

        <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
    <h3 class="text-center text-primary mb-4">💉 Vacinas</h3>

    
        <form action="{{ url_for('saude.salvar_vacina', id_animal=animal.id) }}" method="POST">
        
        <input type="hidden" name="animal_id" value="{{ animal.id }}">
        
        <div class="mb-3">
            <label for="vacina" class="form-label">Vacina:</label>
            <div class="mb-3">
            <label class="form-label">Pet:</label>
            <input type="text" class="form-control" value="{{ animal.nome }}" readonly>
        </div>
            <select name="vacina" id="vacina" class="form-select" required onchange="checkOutraVacina(this)">
                <option value="" disabled selected>Selecione a vacina...</option>
                
                <optgroup label="Cães">
                    <option value="v8_v10">V8 / V10 (Polivalente)</option>
                    <option value="antirrabica_cao">Antirrábica</option>
                    <option value="gripe">Gripe Canina</option>
                    <option value="giardia">Giárdia</option>
                </optgroup>

                <optgroup label="Gatos">
                    <option value="v4_v5">Quádrupla (V4) / Quíntupla (V5)</option>
                    <option value="antirrabica_gato">Antirrábica</option>
                    <option value="felv">FeLV</option>
                </optgroup>

                <option value="outros">Outra...</option>
            </select>
        </div>

        <div class="mb-3" id="campo-outra-vacina" style="display: none;">
            <label for="nome_vacina_outra" class="form-label">Nome da Vacina:</label>
            <input type="text" class="form-control" id="nome_vacina_outra" name="nome_vacina_outra" placeholder="Digite o nome da vacina">
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Status:</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="agendado" name="status_vacina" value="agendada" checked>
                <label class="form-check-label" for="agendado">🗓️ Agendado</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="ok" name="status_vacina" value="aplicada">
                <label class="form-check-label" for="ok">✅ Aplicada</label>
            </div>
        </div>

        <div class="row">
            <div class="col-6 mb-3">
                <label for="data_vacina" class="form-label">Data:</label>
                <input type="date" id="data_vacina" name="data_vacina" class="form-control" required>
            </div>

            <div class="col-6 mb-3">
                <label for="dose" class="form-label">Dose:</label>
                <select name="dose" id="dose" class="form-select">
                    <option value="1">1ª Dose</option>
                    <option value="2">2ª Dose</option>
                    <option value="3">3ª Dose</option>
                    <option value="reforco">Reforço Anual</option>
                </select>
            </div>
        </div>

        <button type="submit" class= "btn btn-primary w-100 btn-lg shadow-sm">Salvar Vacina</button>
        <a href="{{ url_for('animais.pagina_animal', id_animal=animal.id) }}" 
        class="btn btn-outline-secondary w-100 mt-2">
        Cancelar
        </a>
        
    </form>
</div>

<script>
    function checkOutraVacina(select) {
        const campoOutros = document.getElementById('campo-outra-vacina');
        if (select.value === 'outros') {
            campoOutros.style.display = 'block';
            document.getElementById('nome_vacina_outra').required = true;
        } else {
            campoOutros.style.display = 'none';
            document.getElementById('nome_vacina_outra').required = false;
        }
    }
</script>

               
            
    </div>

</body>
</html>
