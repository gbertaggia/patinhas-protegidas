<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Editar Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        @media (max-width: 450px) {
            .card { border: none; box-shadow: none !important; background-color: transparent !important; }
            body { background-color: #fff !important; }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center">
        <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center text-primary mb-4">✏️ Editar Consulta</h3>

            <form method="POST" action="{{ url_for('editar_consulta', id_consulta=consulta.id, id_animal=animal.id) }}">
                
                <div class="mb-3">
                    <label class="form-label">Nome do Pet:</label>
                    <input type="text" class="form-control" value="{{ animal.nome }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="data_consulta" class="form-label">Data da Consulta:</label>
                    <input type="date" id="data_consulta" name="data_consulta" class="form-control" value="{{ consulta.data_consulta }}" required>
                </div>

                <div class="mb-3">
                    <label for="hora_consulta" class="form-label">Horário da Consulta:</label>
                    <input type="time" id="hora_consulta" name="hora_consulta" class="form-control" value="{{ consulta.hora_consulta }}">
                </div>

                <div class="mb-3">
                    <label for="clinica" class="form-label">Clínica / Local:</label>
                    <input type="text" id="clinica" name="clinica" class="form-control" value="{{ consulta.clinica }}">
                </div>

                <div class="mb-3">
                    <label for="veterinario" class="form-label">Veterinário(a):</label>
                    <input type="text" id="veterinario" name="veterinario" class="form-control" value="{{ consulta.veterinario }}">
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo da Consulta:</label>
                    <select name="motivo" id="motivo" class="form-select">
                        <option value="rotina" {% if consulta.motivo == 'rotina' %}selected{% endif %}>Consulta de Rotina</option>
                        <option value="urgência" {% if consulta.motivo == 'urgência' %}selected{% endif %}>Urgência/Emergência</option>
                        <option value="retorno" {% if consulta.motivo == 'retorno' %}selected{% endif %}>Retorno</option>
                        <option value="exame" {% if consulta.motivo == 'exame' %}selected{% endif %}>Realização de Exames</option>
                        <option value="castração" {% if consulta.motivo == 'castração' %}selected{% endif %}>Castração</option>
                        <option value="outro" {% if consulta.motivo == 'outro' %}selected{% endif %}>Outro</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">Atualizar Registro</button>
                <a href="{{ url_for('animais.pagina_animal', id_animal=animal.id) }}" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
