<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas Protegidas - Editar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        @media (max-width: 450px) {
            .card { border: none; box-shadow: none !important; background-color: transparent !important; }
            body { background-color: #fff !important; }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center">
        <div class="card shadow p-4 mt-4" style="width: 100%; max-width: 450px;">
            <h3 class="text-center text-primary mb-4">👤 Meu perfil</h3>

            <form method="POST" action="{{ url_for('auth.editar_perfil_usuario') }}">

                <fieldset class="mb-3">
                    <legend class="form-label fs-6">Você é</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo" id="tipo-protetor" value="PROTETOR" {% if usuario.tipo == 'PROTETOR' %}checked{% endif %} required>
                        <label class="form-check-label" for="tipo-protetor">Protetor(a) independente</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo" id="tipo-ong" value="ONG" {% if usuario.tipo == 'ONG' %}checked{% endif %} required>
                        <label class="form-check-label" for="tipo-ong">ONG</label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" name="nome" class="form-control" value="{{ usuario.nome }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail de Login:</label>
                    <input type="email" id="email" class="form-control bg-light" value="{{ usuario.email }}" readonly>
                    <div class="form-text text-muted">O e-mail de acesso não pode ser alterado.</div>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone / WhatsApp:</label>
                    <input type="text" id="telefone" name="telefone" class="form-control" value="{{ usuario.telefone if usuario.telefone else '' }}" placeholder="(00) 00000-0000">
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-8">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" name="cidade" maxlength="100" value="{{ usuario.cidade if usuario.cidade else '' }}" required>
                    </div>
                    <div class="col-4">
                        <label for="uf" class="form-label">Estado</label>
                        <select class="form-select" id="uf" name="uf" required>
                            <option value="">UF</option>
                            {% for sigla in ufs %}
                            <option value="{{ sigla }}" {% if usuario.uf == sigla %}selected{% endif %}>{{ sigla }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">Salvar Alterações</button>
                <a href="/painel" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cadastro.js') }}" defer></script>
</body>
</html>
