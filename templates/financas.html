<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças - Patinhas Protegidas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/painel" style="text-decoration: none;">
                <span style="color: transparent; text-shadow: 0 0 0 #9b59b6; font-size: 2rem; margin-right: 10px;">🐾</span>
                <span class="text-primary" style="font-weight: bold; font-size: 1.5rem;">Patinhas Protegidas</span>
            </a>
            <span class="navbar-text text-white d-flex align-items-center">
                <h5 class="mb-0 me-3">Olá, {{ session.get('nome_usuario', '') }}! 👋</h5>
                <a href="{{ url_for('auth.editar_perfil_usuario') }}" class="btn btn-sm btn-outline-primary me-2">✏️ Editar Perfil</a>
                <a href="/logout" class="btn btn-sm btn-outline-danger">Sair</a>
            </span>
        </div>
    </nav>

    <main class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Finanças</h1>
            <a href="/painel" class="btn btn-outline-secondary btn-sm">← Voltar ao painel</a>
        </div>

        <div id="aviso-erro" class="alert alert-danger" role="alert" hidden></div>

        <section aria-labelledby="titulo-resumo" class="mb-4">
            <h2 id="titulo-resumo" class="visually-hidden">Resumo financeiro</h2>
            <div class="row g-3" aria-live="polite">
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Receitas</p>
                            <p class="h4 text-success mb-0" id="total-receitas">Carregando…</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Despesas</p>
                            <p class="h4 text-danger mb-0" id="total-despesas">Carregando…</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted mb-1">Saldo</p>
                            <p class="h4 mb-0" id="total-saldo">Carregando…</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section aria-labelledby="titulo-lancamentos">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 id="titulo-lancamentos" class="h5 mb-3">Últimos lançamentos</h2>
                    <p id="sem-lancamentos" class="text-muted" hidden>Nenhum lançamento ainda.</p>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" aria-labelledby="titulo-lancamentos">                            
                            <thead>
                                <tr>
                                    <th scope="col">Data</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col">Animal</th>
                                    <th scope="col">Descrição</th>
                                    <th scope="col" class="text-end">Valor</th>
                                </tr>
                            </thead>
                            <tbody id="lancamentos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/financas.js') }}" defer></script>
</body>

</html>
